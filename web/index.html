<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* Cuaderno rosa de hojas blancas mate. Una hoja por dia de la semana 1. */
:root{
  --mesa:#ffffff; --mesa-2:#fafafa;
  --hoja:#fffefc; --borde:#ecdfe4; --sombra:rgba(160,110,130,.22);
  --tinta:#2a2430; --suave:#6b6270; --lapiz:#a99ca6;
  --rosa:#d4367f; --rosa-claro:#f3d3e0; --lila:#7a5bb5; --verde:#2f8a63;
  --mano:"Caveat",cursive; --mano-2:"Patrick Hand",cursive;
  --texto:"Newsreader",Georgia,serif; --mono:"JetBrains Mono",monospace;
}
/* Cuaderno de papel: siempre claro, aunque el sistema esté en oscuro. */
:root{color-scheme:light}

*{box-sizing:border-box}
body{margin:0;color:var(--tinta);font-family:var(--texto);line-height:1.6;
  background:var(--mesa);
  background-image:repeating-conic-gradient(var(--mesa) 0% 25%,var(--mesa-2) 0% 50%);
  background-size:4px 4px}
.escena{padding-block:clamp(1rem,4vw,2.4rem);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- tapa ---- */
.tapa-zona{display:flex;flex-direction:column;align-items:center;gap:1rem}
.tapa{all:unset;cursor:pointer;position:relative;width:min(20rem,78vw);aspect-ratio:3/3.9;
  background:linear-gradient(100deg,#e05596 0%,#d4367f 30%,#c22c73 70%,#a32260 100%);
  border-radius:4px 14px 14px 4px;box-shadow:0 22px 44px var(--sombra),inset -6px 0 14px rgba(0,0,0,.14);
  transition:transform .3s ease;transform-origin:left center}
.tapa:hover,.tapa:focus-visible{transform:rotateY(-11deg) translateX(3px)}
.tapa .anillos{position:absolute;left:9px;top:12%;bottom:12%;width:11px;border-radius:6px;
  background:repeating-linear-gradient(transparent 0 7%,rgba(255,255,255,.8) 7% 11%,transparent 11% 22%)}
.tapa .brillo{position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(80deg,rgba(255,255,255,.24) 0 13%,transparent 32%,rgba(255,255,255,.1) 64%,transparent 82%)}
.sello{position:absolute;right:1.2rem;top:1.4rem;text-align:right;color:#fff;line-height:1.05}
.sello b{display:block;font-family:var(--mano);font-size:2.4rem}
.sello span{display:block;font-family:var(--mano-2);font-size:.88rem;opacity:.92}
.tapa-pie{position:absolute;left:2.2rem;bottom:1.3rem;font-family:var(--mano-2);color:rgba(255,255,255,.85);font-size:.88rem}
.abrir{font-family:var(--mano-2);color:var(--suave)}

/* ---- hoja ---- */
.cuaderno{max-width:46rem;margin:0 auto;perspective:2000px}
.hoja{position:relative;background:var(--hoja);border:1px solid var(--borde);border-radius:3px 10px 10px 3px;
  box-shadow:0 16px 36px var(--sombra);padding:clamp(1.5rem,4vw,2.4rem) clamp(1.1rem,4vw,2.4rem) 2.6rem clamp(2.5rem,7vw,3.8rem);
  animation:pasar .4s ease-out;transform-origin:left center}
@keyframes pasar{from{transform:rotateY(-12deg);opacity:.6}to{transform:none;opacity:1}}
.hoja::before{content:"";position:absolute;left:0;top:0;bottom:0;width:24px;
  background:repeating-linear-gradient(transparent 0 15px,var(--borde) 15px 18px,transparent 18px 36px)}
.hoja::after{content:"";position:absolute;left:clamp(2rem,6vw,3.1rem);top:0;bottom:0;width:1px;background:var(--rosa);opacity:.3}
.folio{position:absolute;right:1.2rem;bottom:.8rem;font-family:var(--mano-2);color:var(--lapiz);font-size:.88rem}

h1,h2,h3{font-family:var(--mano);margin:0;line-height:1.15;font-weight:700;text-wrap:balance}
h2{font-size:clamp(1.8rem,5vw,2.5rem);color:var(--rosa)}
h3{font-size:1.2rem}
p{margin:0}
a{color:var(--lila)}
.sub{font-family:var(--mano-2);color:var(--suave)}
.sm{font-size:.94rem}.soft{color:var(--suave)}
.stack{display:flex;flex-direction:column;gap:1rem}
code,.mono{font-family:var(--mono);font-size:.85em}
code{background:var(--rosa-claro);border-radius:3px;padding:.05em .3em}
.linea{border-bottom:3px solid var(--rosa-claro);padding-bottom:.15rem}

/* ---- bloques del día ---- */
.totales{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.pastilla{font-family:var(--mono);font-size:.72rem;border:1px solid var(--borde);border-radius:14px;padding:.25rem .65rem;color:var(--suave)}
.pastilla b{color:var(--rosa);font-weight:500}
.bloque{display:grid;grid-template-columns:5.4rem 1fr;gap:.9rem;padding-block:.9rem;border-bottom:1px dotted var(--borde)}
.bloque>*{min-width:0}
.hora{font-family:var(--mono);font-size:.74rem;color:var(--rosa);padding-top:.25rem;line-height:1.5}
.hora b{display:block;color:var(--suave);font-weight:400;font-size:.7rem}
.tarea{display:flex;flex-direction:column;gap:.35rem}
.tarea .q{font-family:var(--mano);font-size:1.3rem}
.recurso{font-family:var(--mano);font-size:1.25rem;color:var(--lila);text-decoration:none;border-bottom:2px solid var(--lila);align-self:flex-start}
.lista{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.3rem;font-size:.94rem;color:var(--suave)}
.chk{display:flex;gap:.55rem;align-items:flex-start;font-size:.95rem;cursor:pointer}
.chk input{margin-top:.3rem;accent-color:var(--rosa);flex:none}
.chk input:checked+span{color:var(--lapiz);text-decoration:line-through}
.caja{border:2px solid var(--rosa-claro);border-radius:6px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.caja.graba{border-color:var(--rosa)}
.caja .tit{font-family:var(--mano);font-size:1.3rem;color:var(--rosa)}
.caja .tit.v{color:var(--verde)}
.guion{display:grid;grid-template-columns:3.4rem 1fr;gap:.3rem .7rem;font-size:.93rem;align-items:baseline}
.guion .s{font-family:var(--mono);font-size:.7rem;color:var(--lapiz)}
.apuntes{width:100%;min-height:9rem;background:transparent;border:none;resize:vertical;color:var(--tinta);
  font-family:var(--mano);font-size:1.3rem;line-height:1.9rem;
  background-image:repeating-linear-gradient(transparent 0 1.85rem,var(--borde) 1.85rem 1.9rem)}
.apuntes:focus-visible{outline:none}

/* ---- navegación ---- */
.barra{max-width:46rem;margin:1rem auto 0;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.pasar{font-family:var(--mano-2);background:var(--hoja);color:var(--tinta);border:1px solid var(--borde);
  border-radius:18px;padding:.4rem 1rem;cursor:pointer;box-shadow:0 4px 12px var(--sombra)}
.pasar:disabled{opacity:.4;cursor:default}
.pasar:hover:not(:disabled){color:var(--rosa);border-color:var(--rosa)}
.pags{display:flex;gap:.3rem;flex-wrap:wrap}
.pag{width:2rem;height:1.7rem;border-radius:12px;border:1px solid var(--borde);background:var(--hoja);
  color:var(--suave);font-family:var(--mano-2);font-size:.78rem;cursor:pointer}
.pag[aria-current="true"]{background:var(--rosa);color:#fff;border-color:var(--rosa)}
.caja.porque{border-color:var(--lila);background:linear-gradient(180deg,rgba(122,91,181,.05),transparent)}
.caja.porque .tit{color:var(--lila);font-size:1.45rem}
.caja.porque .lista li{color:var(--tinta)}
.logro{font-family:var(--mano);font-size:1.25rem;color:var(--verde);margin-top:.4rem}
.fuente{padding-block:.5rem;border-bottom:1px dotted var(--borde);display:flex;flex-direction:column;gap:.1rem}
.fuente a{font-family:var(--mano);font-size:1.2rem;text-decoration:none;border-bottom:2px solid var(--lila)}
.fuente .tipo{font-family:var(--mono);font-size:.66rem;color:var(--lapiz);text-transform:uppercase;letter-spacing:.08em}
.flotante{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:20;font-family:var(--mano-2);background:var(--rosa);color:#fff;border:none;border-radius:20px;
  padding:.55rem 1.1rem;cursor:pointer;box-shadow:0 8px 20px var(--sombra)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(40,25,35,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-caja{background:var(--hoja);border-radius:10px;padding:1.5rem;max-width:24rem;width:100%;
  display:flex;flex-direction:column;gap:.6rem;box-shadow:0 20px 50px var(--sombra)}
.modal-caja h3{color:var(--rosa);font-size:1.6rem}
.hfila{display:flex;flex-direction:column;padding-block:.4rem;border-bottom:1px dotted var(--borde)}
.hfila b{font-family:var(--mono);font-size:.8rem;color:var(--rosa);font-weight:500}
.hfila span{font-size:.93rem;color:var(--suave)}
@media (max-width:560px){.bloque{grid-template-columns:4.4rem 1fr}.guion{grid-template-columns:3rem 1fr}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}.tapa{transition:none}}
</style>

{d:1,porque:"Hoy no aprendo “vectores”: aprendo a representar cualquier cosa como números.",puntos:["Una foto de microscopio es una lista de números. Un texto también. Un audio también. Esa lista ES un vector.","Por eso en Python todo se guarda en listas y arrays: sumar dos imágenes es sumar dos vectores, elemento por elemento.","Normalizar es lo que hace que una foto oscura y una clara se puedan comparar. Sin eso, el modelo aprende el brillo en vez del contenido."],logro:"Al terminar hoy puedo tomar dos listas de números y decir qué tan grandes son, qué dirección tienen y cómo compararlas — sin librerías.",conecta:"El jueves esto se convierte en la operación que mide parecido. El viernes, en una neurona.",fuentes:[["3Blue1Brown · cap. 1 Vectores","https://www.youtube.com/watch?v=fNk_zzaMoSs","video 10 min","La intuición. Verlo una vez entero, sin pausar."],["Khan Academy · Vectores","https://www.khanacademy.org/math/linear-algebra/vectors-and-spaces","curso con ejercicios","Ejercicios infinitos con corrección automática. Para practicar la mano."],["Immersive Math · cap. 2","https://immersivemath.com/ila/ch02_vectors/ch02.html","libro interactivo","Las figuras se mueven. El mejor sitio para jugar con un vector."],["MML · 2.1 y 2.2","https://mml-book.com","libro PDF, gratis","El formalismo serio. Leerlo DESPUÉS del video, no antes."],["MIT 18.06 · Strang","https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/","clases en video","El curso clásico. Para cuando quiera la versión universitaria completa."]],n:"Lunes",t:"Vectores: qué son y cómo se suman",video:"Cap. 1 · Vectores, ¿qué son realmente?",url:"https://www.youtube.com/watch?v=fNk_zzaMoSs",vmin:10,

{d:2,porque:"Hoy aprendo por qué dos columnas de datos pueden ser mentira.",puntos:["Si una columna es “altura en cm” y otra “altura en metros”, no hay dos datos: hay uno disfrazado de dos. Eso es dependencia lineal.","En Python esto aparece como un modelo que entrena “bien” y predice mal, o que da resultados distintos cada vez que lo corres.","El span es cuánta información distinta hay realmente en mis datos. No cuántas columnas tengo."],logro:"Al terminar hoy puedo mirar un conjunto de vectores y decir si alguno sobra.",conecta:"En la fase 3 esto decide cuántos filtros necesita una CNN y por qué más no siempre es mejor.",fuentes:[["3Blue1Brown · cap. 2 Span y base","https://www.youtube.com/watch?v=k7RM-ot2NWY","video 10 min","Span, combinación lineal y base, con animación."],["Khan Academy · Combinaciones y span","https://www.khanacademy.org/math/linear-algebra/vectors-and-spaces","ejercicios","La sección de span e independencia lineal."],["Immersive Math · cap. 3","https://immersivemath.com/ila/ch03_dotproduct/ch03.html","libro interactivo","Seguir moviendo los vectores hasta que el span se entienda solo."],["MML · 2.5","https://mml-book.com","libro PDF","Bases e independencia lineal, con las definiciones formales."]],n:"Martes",t:"Combinaciones lineales, span y base",video:"Cap. 2 · Combinaciones lineales, span y base",url:"https://www.youtube.com/watch?v=k7RM-ot2NWY",vmin:10,

{d:3,porque:"Hoy aprendo que una matriz no es una tabla: es una instrucción.",puntos:["Rotar una foto, hacer zoom, voltearla: cada una es una matriz 2×2 aplicada a cada píxel.","La augmentación de datos — crear más ejemplos rotando y estirando imágenes — es exactamente esto, y es lo que salva un dataset chico de microscopía.","En Python, una capa de una red es una matriz. Cuando escribes model.add(Dense(64)), estás creando una matriz de 64 filas."],logro:"Al terminar hoy puedo leer una matriz 2×2 y decir qué le hace al plano sin calcular nada.",conecta:"En la fase 2, estas matrices son los pesos que la red va ajustando sola.",fuentes:[["3Blue1Brown · cap. 3 Transformaciones","https://www.youtube.com/watch?v=kYB8IZa5AuE","video 11 min","El capítulo más importante de la semana."],["Immersive Math · cap. 6 Matrices","https://immersivemath.com/ila/ch06_matrices/ch06.html","libro interactivo","Mover la matriz y ver la malla deformarse en vivo."],["Khan Academy · Transformaciones lineales","https://www.khanacademy.org/math/linear-algebra/matrix-transformations","curso","Ejercicios de aplicar matrices a vectores."],["MML · 2.7","https://mml-book.com","libro PDF","Transformaciones lineales como mapas entre espacios."],["Colah · Redes neuronales y topología","https://colah.github.io/posts/2014-03-NN-Manifolds-Topology/","blog","Qué hace una red cuando deforma el espacio. Adelanto de la fase 2."]],n:"Miércoles",t:"Transformaciones lineales y matrices",video:"Cap. 3 · Transformaciones lineales y matrices",url:"https://www.youtube.com/watch?v=kYB8IZa5AuE",vmin:11,

{d:4,porque:"Hoy aprendo la operación que está debajo de casi toda la IA moderna.",puntos:["El producto punto mide parecido entre dos listas. Buscar “fotos parecidas a esta” es calcular productos punto y quedarse con los más altos.","La atención de un transformer —lo que hace funcionar a los modelos de lenguaje— es, en su centro, productos punto entre vectores.","En Python se escribe a @ b. Hoy escribo el bucle que hay detrás de ese símbolo, para saber qué cuesta."],logro:"Al terminar hoy puedo calcular parecido entre dos cosas cualesquiera, y sé por qué mi versión es más lenta que NumPy.",conecta:"Mañana esto es literalmente la primera línea de la neurona.",fuentes:[["3Blue1Brown · cap. 4 Composición","https://www.youtube.com/watch?v=XkY2DOUCWMU","video 10 min","Por qué AB no es BA."],["3Blue1Brown · cap. 9 Producto punto","https://www.youtube.com/watch?v=LyGKycYT2v0","video 14 min","La dualidad. Es el capítulo que más veces voy a volver a ver."],["Immersive Math · cap. 3 Producto punto","https://immersivemath.com/ila/ch03_dotproduct/ch03.html","libro interactivo","Ver la proyección moviéndose."],["Khan Academy · Producto punto","https://www.khanacademy.org/math/linear-algebra/vectors-and-spaces","ejercicios","Hasta que salga sin pensar."],["MML · 3.1 y 3.2","https://mml-book.com","libro PDF","Producto interno, normas y ángulos."],["Sebastian Raschka · Ahead of AI","https://magazine.sebastianraschka.com/","substack","Cómo se usa todo esto en modelos reales. Para el bloque de contenido."]],n:"Jueves",t:"Composición y producto punto — la pieza clave",video:"Cap. 4 · Composición · y Cap. 9 · Producto punto",url:"https://www.youtube.com/watch?v=XkY2DOUCWMU",url2:"https://www.youtube.com/watch?v=LyGKycYT2v0",vmin:25,
